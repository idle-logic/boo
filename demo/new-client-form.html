<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New client · Bloom Booking</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; background: #f4f5f7; margin: 0; color: #1d2433; }
      header { background: #24304a; color: #fff; padding: 12px 24px; font-weight: 600; }
      main { max-width: 640px; margin: 28px auto; background: #fff; border-radius: 10px; padding: 24px 28px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
      h1 { font-size: 20px; margin: 0 0 18px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      label { display: block; font-size: 13px; color: #556; margin: 12px 0 4px; }
      input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c9cfda; border-radius: 6px; font: inherit; }
      textarea { min-height: 70px; }
      .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
      button { padding: 9px 18px; border-radius: 6px; border: 1px solid #c9cfda; background: #fff; font: inherit; }
      button.primary { background: #3a63f0; color: #fff; border-color: #3a63f0; }
      #saved { color: #1a7f4b; margin-top: 12px; min-height: 20px; }
    </style>
  </head>
  <body>
    <header>Bloom Booking</header>
    <main>
      <h1>New client</h1>
      <form id="f" autocomplete="off">
        <div class="row">
          <div><label for="first">First name</label><input id="first" name="first" /></div>
          <div><label for="last">Last name</label><input id="last" name="last" /></div>
        </div>
        <div class="row">
          <div><label for="phone">Mobile number</label><input id="phone" name="phone" /></div>
          <div><label for="email">Email</label><input id="email" name="email" type="email" /></div>
        </div>
        <div class="row">
          <div><label for="dob">Date of birth (DD/MM/YYYY)</label><input id="dob" name="dob" /></div>
          <div>
            <label for="staff">Preferred staff</label>
            <select id="staff" name="staff"><option value="">No preference</option><option>Hana</option><option>Tom</option><option>Dr Priya</option></select>
          </div>
        </div>
        <label for="pet">Pet name and breed</label><input id="pet" name="pet" />
        <label for="notes">Notes and allergies</label><textarea id="notes" name="notes"></textarea>
        <div class="actions"><button type="reset">Clear</button><button type="submit" class="primary">Save client</button></div>
        <div id="saved" role="status"></div>
      </form>
    </main>
    <script>
      let count = 0
      document.getElementById('f').addEventListener('submit', e => {
        e.preventDefault()
        const d = Object.fromEntries(new FormData(e.target))
        count++
        document.getElementById('saved').textContent = `Saved ${d.first} ${d.last}. ${count} client${count === 1 ? '' : 's'} added.`
        e.target.reset()
      })
    </script>
  </body>
</html>
