[build]
  command = "node tools/build-site.mjs"
  publish = "site"

[build.environment]
  # The site does not need the Electron binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
