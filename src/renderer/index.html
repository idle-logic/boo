<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
    <title>Haunt</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="boo" role="img" aria-label="Boo the ghost">
      <canvas id="sprite" width="64" height="64"></canvas>
    </div>
    <canvas id="lantern" width="24" height="32" aria-hidden="true"></canvas>
    <div id="bubble" role="status" aria-live="polite" hidden></div>
    <form id="goal-form" hidden autocomplete="off">
      <label for="goal">What should I do?</label>
      <input id="goal" placeholder="Book Mei for a bath on Saturday at 2" />
    </form>
    <script type="module" src="./app.js"></script>
  </body>
</html>
